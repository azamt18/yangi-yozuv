<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yangi Yozuv</title>
    <meta name="manifest.type" content="browser_action" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Yangi Yozuv</h1>
      <p class="rules">sh→ş · ch→ç · oʻ→ö · gʻ→ğ</p>
    </header>

    <section class="converter">
      <h2><label for="convert-input" data-i18n="converterTitle"></label></h2>
      <textarea
        id="convert-input"
        rows="3"
        data-i18n-placeholder="converterPlaceholder"
        spellcheck="false"
      ></textarea>
      <textarea id="convert-output" rows="3" readonly data-i18n-aria-label="converterOutput"></textarea>
      <button id="convert-copy" type="button" data-i18n="copy" disabled></button>
    </section>

    <section class="page-view">
      <button id="page-view-toggle" type="button" data-i18n="pageViewOn" disabled></button>
      <p id="page-view-note" class="muted" hidden></p>
      <button id="page-view-force" type="button" class="secondary" data-i18n="pageForce" hidden></button>
    </section>

    <label class="row switch">
      <span data-i18n="enabled"></span>
      <input id="enabled" type="checkbox" role="switch" />
    </label>

    <section class="row site" id="site">
      <span id="site-name" class="site-name"></span>
      <label id="site-toggle" class="switch" hidden>
        <span data-i18n="siteSwitch"></span>
        <input id="site-enabled" type="checkbox" role="switch" />
      </label>
      <button id="site-grant" type="button" data-i18n="siteGrant" hidden></button>
      <span id="site-unsupported" class="muted" data-i18n="pageUnsupported" hidden></span>
    </section>

    <section class="skip">
      <h2 data-i18n="skipTitle"></h2>
      <form id="skip-form">
        <input id="skip-input" type="text" data-i18n-placeholder="skipPlaceholder" autocomplete="off" />
        <button type="submit" data-i18n="skipAdd"></button>
      </form>
      <ul id="skip-list"></ul>
    </section>

    <footer>
      <p data-i18n="footerUndo"></p>
      <p class="privacy" data-i18n="footerPrivacy"></p>
      <p id="stats" class="muted" hidden></p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
